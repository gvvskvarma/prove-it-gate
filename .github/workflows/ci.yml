name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run validate
      - name: PowerShell hook smoke test
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/smoke-hook.ps1
      - name: pwsh hook smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-hook.ps1
